version: '3.8'

services:
  smart-greenhouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-greenhouse-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - greenhouse-data:/app/data

volumes:
  greenhouse-data:
